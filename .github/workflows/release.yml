name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Universal Binary
        run: bash scripts/build_app.sh release --universal

      - name: Create zip archive
        run: |
          cd .build/release
          ditto -c -k --keepParent Ditto4Mac.app "Ditto4Mac-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/release/Ditto4Mac-*.zip
          generate_release_notes: true
          body: |
            ## 安装说明

            ### 1. 下载并解压
            下载 `Ditto4Mac-*.zip`，解压后将 `Ditto4Mac.app` 拖到 `/Applications/` 目录

            ### 2. 首次打开（绕过 Gatekeeper）
            > 本应用未经 Apple 公证，首次打开时系统会拦截。请选择以下任一方式：

            **方式 A（推荐）：右键打开**
            1. 在 Finder 中找到 `Ditto4Mac.app`
            2. **右键点击** → 选择 **"打开"**
            3. 在弹出的对话框中点击 **"打开"**

            **方式 B：终端命令**
            ```bash
            xattr -cr /Applications/Ditto4Mac.app
            open /Applications/Ditto4Mac.app
            ```

            ### 3. 授权辅助功能
            在 **系统设置 → 隐私与安全性 → 辅助功能** 中授权 Ditto4Mac（用于点击面板外自动隐藏）

            ## 使用方法

            | 操作 | 方式 |
            |------|------|
            | 弹出历史窗口 | `Cmd+Shift+V` 或左键菜单栏图标 |
            | 关于 / 设置 / 退出 | 右键菜单栏图标 |
            | 复制记录 | 点击历史窗口中的记录 |
            | 搜索记录 | 在搜索框输入关键词 |

            ## 系统要求

            - macOS 13 (Ventura)+
            - Universal Binary（同时支持 Apple Silicon 和 Intel）
